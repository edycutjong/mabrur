name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── STAGE 1: Contracts (parallel with frontend + security) ──────────────
  contracts:
    name: "Stage 1 · Contracts (fmt, build, unit + fuzz + invariant, coverage)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/foundry
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Format check
        run: forge fmt --check contracts test script
      - name: Build (with contract sizes)
        run: forge build --sizes
      - name: Tests (unit, fuzz, invariant 256 runs x depth 100)
        run: forge test -vv
      - name: Coverage
        run: forge coverage --report summary --report lcov --no-match-coverage "script|test"
      - uses: actions/upload-artifact@v6
        with:
          name: contracts-coverage
          path: packages/foundry/lcov.info
          retention-days: 7

  frontend-quality:
    name: "Stage 1 · Frontend quality (lint, types)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ${{ github.event_name == 'push' && fromJSON('[20, 22]') || fromJSON('[22]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - run: yarn install --immutable
      - name: Lint
        run: yarn next:lint --max-warnings=0
      - name: Type check
        run: yarn next:check-types
      - name: Unit tests + 100% per-file coverage gate (Vitest)
        run: yarn workspace @se-2/nextjs test:coverage

  # ── STAGE 2: Security (parallel) ─────────────────────────────────────────
  dependency-audit:
    name: "Stage 2 · Dependency audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: yarn npm audit (high + critical, production deps)
        run: yarn npm audit --all --recursive --severity high --environment production
        continue-on-error: true # advisory: transitive web3 deps; Dependabot tracks fixes

  # ── STAGE 3: Build verification ─────────────────────────────────────────
  build:
    name: "Stage 3 · Next.js production build"
    needs: [frontend-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn next:build
      - name: Bundle size report
        run: |
          TOTAL=$(du -sk packages/nextjs/.next/static | cut -f1)
          echo "Static assets: ${TOTAL}KB"
          if [ "$TOTAL" -gt 8000 ]; then echo "::warning::static bundle ${TOTAL}KB exceeds 8000KB"; fi

  # ── STAGE 4: E2E (Playwright against a production build, reading Arbitrum One) ──
  e2e:
    name: "Stage 4 · E2E (Playwright)"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - name: Install Playwright Chromium
        run: yarn workspace @se-2/nextjs playwright install --with-deps chromium
      - name: Run E2E
        run: yarn e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            packages/nextjs/playwright-report/
            packages/nextjs/test-results/
          retention-days: 7

  # ── STAGE 6: Deploy (main only, after every gate) ────────────────────────
  deploy:
    name: "Stage 6 · Deploy to Vercel (mabrur.edycu.dev)"
    needs: [contracts, build, e2e, dependency-audit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_RJcQx4a22v5LqjetHv8HhhLY
      VERCEL_PROJECT_ID: prj_lOJYH75rtEIF2suDMUvuD3s3dwW7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Deploy production
        run: |
          npx --yes vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}" \
            --build-env YARN_ENABLE_IMMUTABLE_INSTALLS=false \
            --build-env ENABLE_EXPERIMENTAL_COREPACK=1 \
            --build-env VERCEL_TELEMETRY_DISABLED=1 | tee deploy.txt
      - name: Smoke-check the live domain
        run: |
          for p in / /app /app/jamaah /app/agen /app/vendor /judge; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "https://mabrur.edycu.dev$p")
            echo "$p $code"; [ "$code" = 200 ] || exit 1
          done
