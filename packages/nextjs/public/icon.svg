<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mabrur: a DITOLAK seal lands on the earmarked line of a kuitansi, so the pilgrim's money stays held">
  <!-- Mabrur mark, v2 "slim + old green" (specs/design.md, Direction v2). Same concept as v1, new palette.
       Three masses (legibility at 16px):
       1 the kuitansi slip with its torn zigzag foot: white sheet, old-green rule (self-plated, holds on #ffffff and #0d1117);
         the two typed rows are hairline detail that dissolves below 32px by design
       2 the earmarked line: gold (state: earmarked / DISIMPAN)
       3 the seal: madder (state: refused / DITOLAK), double-ruled, rotated -7deg, landing ON that line and
         overhanging the slip's edge
       Colours: var(token, #hex). The hex applies when rasterized standalone; v2 tokens win when inlined in the app. -->
  <defs>
    <linearGradient id="mb-sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--paper, #FFFFFF)"/>
      <stop offset="100%" stop-color="var(--bg, #F9F6F0)"/>
    </linearGradient>
  </defs>
  <!-- 1 · kuitansi slip -->
  <path d="M96 66Q96 36 126 36H386Q416 36 416 66V430L393.1 456L370.3 430L347.4 456L324.6 430L301.7 456L278.9 430L256 456L233.1 430L210.3 456L187.4 430L164.6 456L141.7 430L118.9 456L96 430Z"
        fill="url(#mb-sheet)" stroke="var(--returned, #0F3D30)" stroke-width="20" stroke-linejoin="round"/>
  <rect x="146" y="98" width="150" height="18" rx="9" fill="var(--returned, #0F3D30)" fill-opacity=".9"/>
  <rect x="146" y="144" width="220" height="18" rx="9" fill="var(--returned, #0F3D30)" fill-opacity=".28"/>
  <!-- 2 · the earmarked line -->
  <rect x="132" y="234" width="248" height="62" rx="10" fill="var(--earmarked, #C5A869)"/>
  <!-- 3 · the seal -->
  <g transform="rotate(-7 286 300)" fill="none" stroke="var(--refused, #9E2A2B)" stroke-linejoin="round">
    <rect x="148" y="216" width="296" height="168" rx="12" stroke-width="32"/>
    <rect x="186" y="254" width="220" height="92" rx="5" stroke-width="9"/>
  </g>
</svg>
