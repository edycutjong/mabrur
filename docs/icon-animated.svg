<svg xmlns="http://www.w3.org/2000/svg" role="img" width="512" height="512" aria-label="Mabrur: a pilgrim's payment line is earmarked in gold on the kuitansi, then a DITOLAK seal lands on that exact line, so the money stays held" viewBox="0 0 512 512"><!--! STORYBOARD (dur 6s, one CSS master loop; v2 "slim + old green")
  0-60%    rest:       the complete v2 mark on its own cream tile: kuitansi slip (old-green rule), two typed rows,
                       the gold earmarked line, the madder double-ruled seal on it. Frame 0 = the static icon.svg.
  60-66%   lift:       the seal lifts off the line (opacity 1 to 0, scale 1 to 1.16, soft blur).          data-story="seal"
  66-70%   clear:      the gold line empties to its pale earmark outline.                                   data-story="line"
  72-82%   earmark:    gold fills the line left to right (the rupiah is set aside for one booking, one pos).
  84-88.5% verdict:    Agen membayar hotel Ibu Siti dari dana Pak Ahmad — cap merah DITOLAK · EarmarkMismatch mendarat di kuitansi.
                       (wordless: the seal lands ON the line, 420 ms, scale 1.16 to 1 + blur to sharp, no overshoot)
  88.5-100% rest:      back to the exact frame-0 mark; seam is invisible. Reduced motion = static final frame.--><style>[data-story]{transform-box:fill-box}
.seal{transform-origin:center;transform:rotate(-7deg);animation:kseal 6s cubic-bezier(.2,.9,.25,1) infinite}
.line{transform-origin:0 50%;animation:kline 6s cubic-bezier(.45,0,.2,1) infinite}
@keyframes kseal{0%,60%{opacity:1;transform:rotate(-7deg) scale(1);filter:none}66%,84%{opacity:0;transform:rotate(-7deg) scale(1.16);filter:blur(6px)}88.5%,100%{opacity:1;transform:rotate(-7deg) scale(1);filter:none}}
@keyframes kline{0%,66%{transform:scaleX(1);opacity:1}70%{transform:scaleX(1);opacity:0}71%,72%{transform:scaleX(0);opacity:1}82%,100%{transform:scaleX(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="isheet" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f9f6f0"/></linearGradient></defs><!--self-plate: cream tile, reads on GitHub #ffffff and #0d1117--><rect width="500" height="500" x="6" y="6" fill="#f9f6f0" stroke="#e2d9c6" stroke-width="4" rx="112"/><g transform="translate(256 262) scale(.78) translate(-272 -246)"><!--kuitansi slip--><path fill="url(#isheet)" stroke="#0f3d30" stroke-linejoin="round" stroke-width="20" d="M96 66q0-30 30-30h260q30 0 30 30v364l-22.9 26-22.8-26-22.9 26-22.8-26-22.9 26-22.8-26-22.9 26-22.9-26-22.8 26-22.9-26-22.8 26-22.9-26-22.8 26L96 430Z"/><rect width="150" height="18" x="146" y="98" fill="#0f3d30" fill-opacity=".9" rx="9"/><rect width="220" height="18" x="146" y="144" fill="#0f3d30" fill-opacity=".28" rx="9"/><!--the earmarked line: pale outline underneath, gold fill on top--><rect width="244" height="58" x="134" y="236" fill="#f7f1e3" stroke="#c5a869" stroke-width="4" rx="9"/><rect width="248" height="62" x="132" y="234" fill="#c5a869" class="line" data-story="line" rx="10"/><!--the seal (DITOLAK, madder, double-ruled)--><g><g fill="none" stroke="#9e2a2b" stroke-linejoin="round" class="seal" data-story="seal"><rect width="296" height="168" x="148" y="216" stroke-width="32" rx="12"/><rect width="220" height="92" x="186" y="254" stroke-width="9" rx="5"/></g></g></g></svg>